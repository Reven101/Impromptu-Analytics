# Måler hastigheten til samme modell hos OpenRouter og hos NVIDIA, og legger
# tabellen i kjøringssammendraget.
#
# Poenget er det samme som for api-atlas.yml og sonder-kilder.yml: dette skal
# kunne kjøres fra en telefon uten Codespace — og her er det i tillegg det ENESTE
# stedet begge nøklene finnes. De ligger som secrets, ikke på en maskin.
#
# Ingen tidsplan. Dette er en engangsmåling vi tar når vi lurer på hvor et
# byggesteg skal kjøres, ikke overvåking. Ingenting commites: det som kommer ut
# er en utskrift, og den hører hjemme i sammendraget.
#
# MERK at et tall herfra er målt fra en GitHub-kjører i et av Azures datasentre,
# ikke fra utviklingsmaskinen. Nettverksavstanden til leverandøren er en del av
# målingen, og den er ikke den samme hjemmefra.
name: LLM-hastighet

on:
  # MIDLERTIDIG: workflow_dispatch krever at fila ligger på standardgreina, og
  # det gjør den ikke ennå. Push-triggeren er eneste måte å faktisk kjøre
  # målingen fra denne greina. Fjernes når målingen er tatt.
  push:
    branches:
      - claude/gpt-oss-20b-speed-test-eeyt9s
    paths:
      - pipeline/mal_llm_hastighet.py
      - .github/workflows/llm-hastighet.yml
  workflow_dispatch:
    inputs:
      modell:
        description: "Modellnavn uten leverandørprefiks"
        required: true
        default: openai/gpt-oss-20b
        type: string
      runder:
        description: "Målte runder per arbeidsmengde (etter oppvarming)"
        required: true
        default: "3"
        type: string
      parallell:
        description: "Samtidige kall i bulktesten (1 = hopp over)"
        required: true
        default: "4"
        type: string
      resonnering:
        description: "reasoning_effort"
        required: true
        default: low
        type: choice
        options:
          - low
          - medium
          - high

permissions:
  contents: read

jobs:
  mal:
    name: Mål hastigheten begge steder
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pipelinen er stdlib-only. Ingenting å installere.
          python-version: "3.11"

      - name: Kjør målingen
        env:
          # Uten denne er en drept kjøring stum: Python blokkbuffrer stdout mot
          # et rør (her: tee), og en jobb som treffer tidsgrensa tar loggen med
          # seg i grava.
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Valgene går via miljøet framfor rett inn i skallkommandoen: en input
          # som interpoleres inn i en run-blokk er tekst som blir til kode. Og på
          # et push-anrop finnes ingen inputs i det hele tatt — da må
          # standardverdiene stå her, ellers kjører scriptet på tomme argumenter.
          MODELL: ${{ inputs.modell || 'openai/gpt-oss-20b' }}
          RUNDER: ${{ inputs.runder || '3' }}
          PARALLELL: ${{ inputs.parallell || '4' }}
          RESONNERING: ${{ inputs.resonnering || 'low' }}
        run: |
          # pipefail, ellers spiser tee exit-koden og en halv tabell ser grønn ut.
          set -o pipefail
          python3 pipeline/mal_llm_hastighet.py \
            --modell "$MODELL" \
            --runder "$RUNDER" \
            --parallell "$PARALLELL" \
            --resonnering "$RESONNERING" 2>&1 | tee kjoring.txt

      - name: Legg tabellen i kjøringssammendraget
        # Også når målingen feilet — det er nettopp da du vil lese den. Feilet én
        # leverandør, står den andres tall fortsatt i utskriften.
        if: always()
        env:
          MODELL: ${{ inputs.modell || 'openai/gpt-oss-20b' }}
        run: |
          {
            echo "## LLM-hastighet — $MODELL — $(date -u '+%d.%m.%Y %H:%M UTC')"
            echo
            if [ -f kjoring.txt ]; then
              echo '```'
              cat kjoring.txt
              echo '```'
            else
              echo "Målingen kom aldri i gang — se loggen for steget over."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
