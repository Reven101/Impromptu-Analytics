<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datahistorie — Impromptu Analytics</title>
  <meta name="description" content="Offentlige data, fortalt visuelt. En datahistorie fra Impromptu Analytics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="motor/tokens.css">
  <link rel="stylesheet" href="motor/komponenter.css">
  <style>
    .side-topp {
      text-align: center;
      padding: var(--rom-4) var(--rom-4) 0;
    }
    .side-topp a {
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .side-topp a:hover { text-decoration: underline; }

    .historie-topp {
      text-align: center;
      max-width: var(--maal-bredde);
      margin: var(--rom-5) auto 0;
      padding: 0 var(--rom-4) var(--rom-5);
      border-bottom: 3px double var(--gran);
    }
    .historie-topp h1 {
      font-size: clamp(1.9rem, 6vw, 2.9rem);
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--gran);
      margin: .3em 0 .4em;
      line-height: 1.15;
    }

    .historie-prosa {
      max-width: var(--tekst-bredde);
      margin: var(--rom-5) auto;
      padding: 0 var(--rom-4);
    }
    .historie-prosa h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--gran);
      text-align: center;
      margin-bottom: var(--rom-3);
    }
    .historie-prosa h3 { font-size: 1.1rem; color: var(--gran); margin-bottom: var(--rom-2); }
    .historie-prosa p + p { margin-top: var(--rom-3); }
    .historie-prosa ul { padding-left: 1.3em; }
    .historie-prosa blockquote {
      border-left: 3px solid var(--sennep);
      padding-left: var(--rom-3);
      color: var(--blekk-sekundaer);
      font-style: italic;
    }

    .kildekort {
      max-width: var(--maal-bredde);
      margin: var(--rom-6) auto var(--rom-5);
      padding: var(--rom-5) var(--rom-4);
      text-align: center;
    }
    .kildekort-rute {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--rom-4) var(--rom-6);
      margin: var(--rom-4) 0;
    }
    .kildekort-rute dd { font-size: .95rem; }
    .kildekort-lenke { font-size: .9rem; }

    footer {
      text-align: center;
      padding: var(--rom-5) var(--rom-4) var(--rom-6);
      color: var(--blekk-dempet);
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <div class="side-topp"><a href="./">← Alle datahistorier</a></div>
  <main id="historie" aria-live="polite">
    <p style="text-align:center; padding: 80px 20px; color: var(--blekk-dempet);">Laster historien …</p>
  </main>
  <footer>Impromptu Analytics — offentlige data, fortalt visuelt</footer>
  <script type="module" src="motor/historie.js"></script>
</body>
</html>
