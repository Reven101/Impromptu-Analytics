<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datahistorier — Impromptu Analytics</title>
  <meta name="description" content="Offentlige data, fortalt visuelt. Datahistorier fra Impromptu Analytics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="motor/tokens.css">
  <style>
    header {
      text-align: center;
      padding: var(--rom-6) var(--rom-4) var(--rom-5);
      border-bottom: 3px double var(--gran);
      max-width: var(--maal-bredde);
      margin: 0 auto;
    }
    header h1 {
      font-size: clamp(1.9rem, 6vw, 2.9rem);
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--gran);
      margin: .25em 0 .2em;
    }
    .pitch { max-width: 50ch; margin: 0 auto; color: var(--blekk-sekundaer); }

    .galleri {
      max-width: var(--maal-bredde);
      margin: var(--rom-5) auto var(--rom-7);
      padding: 0 var(--rom-4);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--rom-4);
      justify-content: center;
    }
    .historie-kort {
      display: block;
      text-decoration: none;
      color: var(--blekk);
      padding: var(--rom-5) var(--rom-4);
      text-align: center;
      transition: transform .15s, box-shadow .15s;
    }
    .historie-kort:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px var(--skygge);
    }
    .historie-kort h2 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--gran);
      margin: var(--rom-2) 0 var(--rom-2);
      line-height: 1.3;
    }
    .historie-kort p { font-size: .92rem; color: var(--blekk-sekundaer); }
    .historie-kort .meta-rad {
      margin-top: var(--rom-3);
      padding-top: var(--rom-3);
      border-top: 1px solid var(--linje-svak);
    }
    .historie-kort .demo-merke { margin-top: var(--rom-2); }

    .tom-melding, .feil-melding {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--blekk-dempet);
      padding: var(--rom-6) 0;
      font-family: var(--font-mono);
      font-size: .85rem;
    }
    footer {
      text-align: center;
      padding: var(--rom-5) var(--rom-4) var(--rom-6);
      color: var(--blekk-dempet);
      font-size: .8rem;
    }
    footer a { color: var(--blekk-dempet); }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Impromptu Analytics</div>
    <h1>Datahistorier</h1>
    <p class="pitch">Offentlige data, fortalt visuelt. Hver historie bygger på et åpent,
      offentlig datasett — kilden står alltid oppgitt.</p>
  </header>

  <main class="galleri" id="galleri">
    <p class="tom-melding">Laster historier …</p>
  </main>

  <footer><a href="/">impromptu.no</a></footer>

  <script type="module">
    /* Forsiden genereres automatisk fra manifest.json — som igjen bygges
       fra innholdsmappen med pipeline/bygg_manifest.py. */
    const galleri = document.getElementById("galleri");

    function el(tag, klasse, tekst) {
      const e = document.createElement(tag);
      if (klasse) e.className = klasse;
      if (tekst !== undefined) e.textContent = tekst;
      return e;
    }

    try {
      const svar = await fetch("innhold/manifest.json");
      if (!svar.ok) throw new Error(`HTTP ${svar.status}`);
      const manifest = await svar.json();
      galleri.replaceChildren();

      if (!manifest.historier?.length) {
        galleri.appendChild(el("p", "tom-melding",
          "Ingen historier ennå — legg en mappe i historier/innhold/ og kjør pipeline/bygg_manifest.py"));
      }

      for (const h of manifest.historier || []) {
        const kort = el("a", "historie-kort kort-flate");
        kort.href = `historie.html?id=${encodeURIComponent(h.id)}`;
        kort.appendChild(el("div", "eyebrow", h.kilde));
        kort.appendChild(el("h2", null, h.tittel));
        kort.appendChild(el("p", null, h.beskrivelse));
        kort.appendChild(el("div", "mono-etikett meta-rad", `${h.geografi} · hentet ${h.dato_hentet}`));
        if (h.demo) kort.appendChild(el("div", "demo-merke", "Demodata"));
        galleri.appendChild(kort);
      }
    } catch (e) {
      galleri.replaceChildren(el("p", "feil-melding",
        `Kunne ikke laste manifest.json (${e.message}). Kjør pipeline/bygg_manifest.py.`));
    }
  </script>
</body>
</html>
